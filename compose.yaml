services:
  
  # PostgreSQL Database 17
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docanai_db
    ports:
      - "5444:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama Local AI
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/data

  # Minio S3 Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Migrator
  migrator:
    image: docanai.migrator
    build:
      context: .
      dockerfile: src/DocANAI.Migrator/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=docanai_db;Username=postgres;Password=postgres;"
    depends_on:
      db:
        condition: service_healthy
  
  # API
  docanai.api:
    image: docanai.api
    build:
      context: .
      dockerfile: src/DocANAI.Api/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=docanai_db;Username=postgres;Password=postgres;"
      MinIO__Endpoint: "minio:9000"
      MinIO__PublicEndpoint: "localhost:9000"
      MinIO__AccessKey: minioadmin
      MinIO__SecretKey: minioadmin123
      MinIO__Bucket: docanai
      JwtSettings__Secret: "SuperSecretKeyForLocalDevelopment12345!"
      JwtSettings__Issuer: "DocANAI"
      JwtSettings__Audience: "DocANAIClient"
      JwtSettings__AccessTokenExpiryMinutes: "60"
      JwtSettings__RefreshTokenExpiryDays: "7"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: "/"
      ConnectionStrings__Redis: "redis:6379"
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      Ollama__BaseUrl: "http://ollama:11434"
      Ollama__TimeoutSeconds: 120
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
          
  # Worker
  docanai.worker:
    image: docanai.worker
    build:
      context: .
      dockerfile: src/DocANAI.Worker/Dockerfile
    environment:
      # разные форматы строк для подключения к бд
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=docanai_db;Username=postgres;Password=postgres;"
      connectionstrings__defaultconnection: "Host=db;Port=5432;Database=docanai_db;Username=postgres;Password=postgres;"
      ConnectionStrings:DefaultConnection: "Host=db;Port=5432;Database=docanai_db;Username=postgres;Password=postgres;"
      DOTNET_ENVIRONMENT: "Development"
      # изменил окружение на дев
      ASPNETCORE_ENVIRONMENT: "Development"
      
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: "/"
      MinIO__Endpoint: "minio:9000"
      MinIO__AccessKey: minioadmin
      MinIO__SecretKey: minioadmin123
      MinIO__Bucket: docanai
      Ollama__BaseUrl: "http://ollama:11434"
      Ollama__TimeoutSeconds: 120
      Ollama__MaxRetries: 3
      Ollama__RetryDelaySeconds: 2
      Ollama__MaxDocumentCharacters: 120000
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_healthy
  
  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - docanai.api

  # Redis
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  minio_data:
  ollama_data:
