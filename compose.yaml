services:
  
  # PostgreSQL Database 17
  db:
    image: postgres:17
    environment:

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5444:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMQ__Username}
      RABBITMQ_DEFAULT_PASS: ${RabbitMQ__Password}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama Local AI
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Minio S3 Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Migrator
  migrator:
    image: docanai.migrator
    build:
      context: .
      dockerfile: src/DocANAI.Migrator/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
    depends_on:
      db:
        condition: service_healthy
  
  # API
  docanai.api:
    image: docanai.api
    build:
      context: .
      dockerfile: src/DocANAI.Api/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      ConnectionStrings__Redis: redis:6379
      
      MinIO__Endpoint: minio:9000
      MinIO__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MinIO__AccessKey: ${MINIO_ACCESS_KEY}
      MinIO__SecretKey: ${MINIO_SECRET_KEY}
      MinIO__Bucket: docanai
      
      JwtSettings__Secret: ${JwtSettings__Secret}
      JwtSettings__Issuer: DocANAI
      JwtSettings__Audience: DocANAI_Clients
      JwtSettings__AccessTokenExpiryMinutes: 15
      JwtSettings__RefreshTokenExpiryDays: 7
      
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RabbitMQ__Username}
      RabbitMQ__Password: ${RabbitMQ__Password}
      RabbitMQ__VirtualHost: /
      
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  # Worker
  docanai.worker:
    image: docanai.worker
    build:
      context: .
      dockerfile: src/DocANAI.Worker/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      ConnectionStrings__Redis: redis:6379
      
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RabbitMQ__Username}
      RabbitMQ__Password: ${RabbitMQ__Password}
      RabbitMQ__VirtualHost: /
        
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ACCESS_KEY}
      MinIO__SecretKey: ${MINIO_SECRET_KEY}
      MinIO__Bucket: docanai
      
      Ollama__BaseUrl: http://ollama:11434
      Ollama__TimeoutSeconds: 120
      Ollama__MaxRetries: 3
      Ollama__RetryDelaySeconds: 2
      Ollama__MaxDocumentCharacters: 120000
      
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
  
  # Client
  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - docanai.api

volumes:
  minio_data:
  ollama_data: