services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  migrator:
    image: docanai.migrator
    build:
      context: .
      dockerfile: src/DocANAI.Migrator/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
    depends_on:
      db:
        condition: service_healthy
  
  
  docanai.api:
    image: docanai.api
    build:
      context: .
      dockerfile: src/DocANAI.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - MinIO__Endpoint=${MINIO_ENDPOINT}
      - MinIO__PublicEndpoint=${MINIO_PUBLIC_ENDPOINT}
      - MinIO__AccessKey=${MINIO_ACCESS_KEY}
      - MinIO__SecretKey=${MINIO_SECRET_KEY}
      - MinIO__Bucket=${MINIO_BUCKET}
      - JwtSettings__Secret=${JwtSettings__Secret}
      - JwtSettings__Issuer=${JwtSettings__Issuer}
      - JwtSettings__Audience=${JwtSettings__Audience}
      - JwtSettings__AccessTokenExpiryMinutes=${JwtSettings__AccessTokenExpiryMinutes}
      - JwtSettings__RefreshTokenExpiryDays=${JwtSettings__RefreshTokenExpiryDays}
      - RabbitMQ__Host=${RabbitMQ__Host:-rabbitmq}
      - RabbitMQ__Port=${RabbitMQ__Port:-5672}
      - RabbitMQ__Username=${RabbitMQ__Username:-guest}
      - RabbitMQ__Password=${RabbitMQ__Password:-guest}
      - RabbitMQ__VirtualHost=${RabbitMQ__VirtualHost:-/}
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      
  docanai.worker:
    image: docanai.worker
    build:
      context: .
      dockerfile: src/DocANAI.Worker/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - RabbitMQ__Host=${RabbitMQ__Host:-rabbitmq}
      - RabbitMQ__Port=${RabbitMQ__Port:-5672}
      - RabbitMQ__Username=${RabbitMQ__Username:-guest}
      - RabbitMQ__Password=${RabbitMQ__Password:-guest}
      - RabbitMQ__VirtualHost=${RabbitMQ__VirtualHost:-/}
      - MinIO__Endpoint=${MINIO_ENDPOINT}
      - MinIO__AccessKey=${MINIO_ACCESS_KEY}
      - MinIO__SecretKey=${MINIO_SECRET_KEY}
      - MinIO__Bucket=${MINIO_BUCKET}
      - Ollama__BaseUrl=${Ollama__BaseUrl:-http://ollama:11434}
      - Ollama__TimeoutSeconds=${Ollama__TimeoutSeconds:-120}
      - Ollama__MaxRetries=${Ollama__MaxRetries:-3}
      - Ollama__RetryDelaySeconds=${Ollama__RetryDelaySeconds:-2}
      - Ollama__MaxDocumentCharacters=${Ollama__MaxDocumentCharacters:-120000}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
  
  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - docanai.api

volumes:
  minio_data:
  ollama_data: